<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="theme-color" content="#f8fafc" />

		<!-- Основные SEO-теги -->
		<meta
			name="description"
			content="Интерактивная платформа для изучения основ программирования через игру. Учим алгоритмам и логике детей от 6 лет."
		/>
		<title>Kids Informatics — Программирование для детей</title>

		<!-- Favicon -->
		<link rel="icon" href="/favicon.png" />

		<!-- Open Graph (для красивых карточек в Telegram, VK, WhatsApp) -->
		<meta property="og:title" content="Kids Informatics — Программирование для детей" />
		<meta
			property="og:description"
			content="Интерактивная платформа для изучения основ программирования через игру. Учим алгоритмам и логике детей от 6 лет."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://kids-informatics.mk5d.ru/" />
		<meta property="og:image" content="https://kids-informatics.mk5d.ru/og-image.jpg" />
		<meta property="og:locale" content="ru_RU" />

		<!-- Канонический URL -->
		<link rel="canonical" href="https://kids-informatics.mk5d.ru/" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div class="sveltekit-body">%sveltekit.body%</div>

		<!-- Микроразметка Schema.org -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "EducationalOrganization",
				"name": "Kids Informatics",
				"description": "Интерактивная платформа для изучения основ программирования через игру.",
				"url": "https://kids-informatics.mk5d.ru/",
				"logo": "https://kids-informatics.mk5d.ru/logo.png",
				"sameAs": ["https://github.com/mikarchevski/kids-informatics"]
			}
		</script>
	</body>
</html>
